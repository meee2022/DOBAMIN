name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx wrangler d1 migrations apply dopamine-orders --local
      - run: npx wrangler dev --port 8787 --var DOPAMINE_ADMIN_KEY:test-key-only &
      - run: npx -y wait-on@8 -t 60000 http-get://127.0.0.1:8787/api/health
      - run: npm run test:cloudflare
